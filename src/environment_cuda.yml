name: XCS231N_CUDA
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.12
  - notebook=7.5.0
  - h5py=3.15.1
  - imageio=2.37.2
  - ipython=9.7.0
  - json5=0.12.1
  - matplotlib=3.10.8
  - pillow=12.0.0
  - future=1.0.0
  - cython=3.2.2
  - scipy=1.16.3
  - pandas=2.3.3
  - tqdm=4.67.1
  - scikit-learn=1.8.0
  - pip=25.3
  - pip:
    - "--find-links https://download.pytorch.org/whl/torch/"
    - torch==2.9.1+cu126
    - "--find-links https://download.pytorch.org/whl/torchvision/"
    - torchvision==0.24.1+cu126
    - git+https://github.com/openai/CLIP.git
    - ftfy==6.3.1
    - regex==2026.1.15
    - thop==0.1.1-2209072238
    # required by tensorflow
    - numpy==2.2.6
    - tensorflow==2.20.0
    - tensorflow_datasets==4.9.9
    - opencv-python==4.12.0.88
